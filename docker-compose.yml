# Postgres + pgvector for study-rag. Reproducible local store; DB data lives in
# a named Docker volume, not the repo. Bring up with: docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: study-rag-db
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
      POSTGRES_DB: study_rag
    ports:
      # Host 5433 avoids a clash with a native Postgres already on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once on first init to create the extension, tables, and index.
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d study_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
